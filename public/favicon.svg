<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1326" />
      <stop offset="100%" stop-color="#101D3B" />
    </linearGradient>

    <!-- Brand Green Gradient -->
    <linearGradient id="solGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="50%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <!-- Glow Filter for High-DPI Displays -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#solGradient)" stroke-width="8" stroke-opacity="0.4" />

  <!-- Solbasket Symbol: Modern Geometric "S" Basket Icon -->
  <g filter="url(#glow)">
    <!-- Top Arc Curve -->
    <path d="M 352 168 C 352 128, 312 104, 256 104 C 188 104, 144 144, 144 200 C 144 272, 368 240, 368 316 C 368 376, 316 408, 256 408 C 180 408, 140 360, 140 320" 
          fill="none" 
          stroke="url(#solGradient)" 
          stroke-width="52" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Tech Nodes / Acceleration Dots -->
    <circle cx="352" cy="168" r="28" fill="#00E676" />
    <circle cx="140" cy="320" r="28" fill="#00B0FF" />
    <circle cx="256" cy="256" r="20" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>